<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
<title id="title">Filomena frontend: historical architecture overview</title><desc id="desc">Historical Filomena frontend: administrator, student and evaluator workspaces share the Next.js client and Axios API client. The Laravel API, not browser guards, enforces authentication, permissions and institution boundaries. MariaDB or MySQL and Redis support the platform; Prometheus feeds Grafana.</desc>
